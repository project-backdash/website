    var rawKey;
    deriveKey(input.value)
      .then(function (k) { rawKey = k; return decrypt(k); })
      .then(function (html) { remember(rawKey); render(html); })
      .catch(function () {
        button.disabled = false;
        status.textContent = "That code didn't work. Check it and try again.";
        input.select();
      });
  });
})();
</script>
</body>
