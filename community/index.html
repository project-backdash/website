<style>
  html, body { min-height: 100%; }
  body.gate-body { margin: 0; background: var(--petrol-900); }
  .gate-pending .gate { visibility: hidden; }
  .gate-wrap { min-height: 100vh; min-height: 100dvh; display: grid; align-items: center; padding: 48px 16px; box-sizing: border-box; }
  .gate { width: 100%; max-width: 560px; margin: 0 auto; display: grid; gap: 24px; }
  /* The horizontal lockup: mark 32/13 cap tall, a gap of one cap, the wordmark (13 px cap; smaller on narrow phones). */

  .gate .hero-sub { margin: 0; }
  .gate-social { margin-top: 8px; padding-top: 16px; border-top: 1px solid rgba(143, 195, 202, .16); }
  .gate-social .social-links { margin-block: 0; }
  .gate-form { display: grid; gap: 8px; margin-top: 8px; padding-top: 24px; border-top: 1px solid rgba(143, 195, 202, .16); }
  .gate-label { font-family: "Barlow", sans-serif; font-weight: 600; font-size: 15px; color: var(--text-2); }
  .gate-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
  .gate-row input { flex: 1 1 220px; min-width: 0; height: 48px; padding: 0 14px; box-sizing: border-box;
    border: 1.5px solid #6F8C92; border-radius: 4px; background: var(--petrol-950); color: var(--text-1);
    font: 600 18px/1 "Barlow", sans-serif; letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .gate-row input::placeholder { color: var(--text-3); opacity: 1; letter-spacing: .1em; }
  .gate-row input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .gate-row .btn-primary { flex: none; }
  .gate-row .btn-primary:disabled { cursor: progress; opacity: .75; }
  #gate-status { margin: 0; min-height: 1.5em; font-family: "Barlow", sans-serif; font-size: 15px; color: var(--text-2); }
  @media (max-width: 420px) { .gate-row .btn-primary { width: 100%; } }
</style>

<script>(function () {
  "use strict";
  var root = document.documentElement;
  var data = document.getElementById("pbd-gate-data");
  var payload = data.getAttribute("data-payload");
  var salt = data.getAttribute("data-salt");
  var iterations = parseInt(data.getAttribute("data-iterations"), 10);
  var STORE = "pbd-preview-key:" + salt;

  function fromB64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function normalize(code) {
    return String(code).toUpperCase().replace(/[^A-Z0-9]/g, "");
  }
  function deriveKey(code) {
    return crypto.subtle
      .importKey("raw", new TextEncoder().encode(normalize(code)), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(salt), iterations: iterations }, base, 256);
      });
  }
  function decrypt(rawKey) {
    var bytes = fromB64(payload);
    return crypto.subtle
      .importKey("raw", rawKey, "AES-GCM", false, ["decrypt"])
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
      })
      .then(function (plain) {
        return new TextDecoder().decode(plain);
      });
  }
  // document.open() is ignored while the parser is still running (it would append instead of replace), so wait until
  // this shell has finished parsing before swapping in the real page.
  function render(html) {
    function swap() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { setTimeout(swap, 0); });
    } else {
      setTimeout(swap, 0);
    }
  }
  function remember(rawKey) {
    try { localStorage.setItem(STORE, toB64(rawKey)); } catch (e) {}
  }
  function recall() {
    try {
      var v = localStorage.getItem(STORE);
      return v ? fromB64(v).buffer : null;
    } catch (e) { return null; }
  }
  function forget() {
    try { localStorage.removeItem(STORE); } catch (e) {}
  }
  function reveal() {
    root.classList.remove("gate-pending");
  }

  if (!window.crypto || !crypto.subtle) {
    // Pages open only in a secure context with Web Crypto (HTTPS and any current browser); say so instead of failing.
    reveal();
    var noCrypto = document.getElementById("gate-submit");
    var noCryptoStatus = document.getElementById("gate-status");
    if (noCrypto) noCrypto.disabled = true;
    if (noCryptoStatus) noCryptoStatus.textContent = "This browser can't open the preview. Try a current Chrome, Edge, Firefox or Safari.";
    return;
  }
  if (/[?&]lock(?:[=&]|$)/.test(location.search)) forget();

  var saved = recall();
  if (saved) {
    decrypt(saved).then(render, function () { forget(); reveal(); });
  } else {
    reveal();
  }

  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-code");
  var button = document.getElementById("gate-submit");
  var status = document.getElementById("gate-status");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (normalize(input.value).length < 10) {
      status.textContent = "Enter the full code, for example ABCD-EFGH-JKMN.";
      input.focus();
      return;
    }
    button.disabled = true;
    status.textContent = "Checking…";
    var rawKey;
    deriveKey(input.value)
      .then(function (k) { rawKey = k; return decrypt(k); })
      .then(function (html) { remember(rawKey); render(html); })
      .catch(function () {
        button.disabled = false;
        status.textContent = "That code didn't work. Check it and try again.";
        input.select();
      });
  });
})();
